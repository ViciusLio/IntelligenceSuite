[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligence-suite"
version = "0.1.3"
description = "Modular knowledge retrieval suite: code, docs, APIs — all on-premise"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ViciusLio", email = "viciuslios@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "rag", "retrieval-augmented-generation", "knowledge-retrieval",
    "code-intelligence", "document-intelligence", "onboarding",
    "llm", "on-premise", "enterprise", "chromadb", "ollama",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
pdf  = ["pypdf>=4.0.0", "pdfplumber>=0.11.0"]
ocr  = ["pytesseract>=0.3.10", "Pillow>=10.0.0"]
docx = ["python-docx>=1.1.0"]
xlsx = ["openpyxl>=3.1.0"]
st     = ["sentence-transformers>=2.7.0"]
openai = ["openai>=1.0.0"]
claude = ["anthropic>=0.25.0"]
dev    = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "mypy>=1.10.0"]
all    = ["intelligence-suite[pdf,ocr,docx,xlsx,st,openai,claude]"]

[project.scripts]
ci-parse   = "CodeIntelligence.parse_repo:main"
ci-embed   = "CodeIntelligence.embed_chunks:main"
ci-serve   = "CodeIntelligence.rag_server:main"
di-ingest  = "DocIntelligence.ingest_docs:main"
di-embed   = "DocIntelligence.embed_docs:main"
di-serve   = "DocIntelligence.doc_server:main"
mi-ingest  = "MentorIntelligence.content.ingest_practices:main"
mi-serve   = "MentorIntelligence.mentor_server:main"

[project.urls]
Homepage   = "https://github.com/ViciusLio/IntelligenceSuite"
Repository = "https://github.com/ViciusLio/IntelligenceSuite"
Issues     = "https://github.com/ViciusLio/IntelligenceSuite/issues"
Author     = "https://www.linkedin.com/in/vincenzo-lio-dataengineer/"

[tool.setuptools.packages.find]
where = ["."]
include = ["intelligence_core*", "CodeIntelligence*", "DocIntelligence*", "MentorIntelligence*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
